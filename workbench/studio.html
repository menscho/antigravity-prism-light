<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidian Prism · Bipolar Studio Preview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23111216'/%3E%3Cpath fill='%23669DF6' d='M12 2.2c.23 0 .43.16.49.38c.19.72.44 1.43.73 2.11c1.13 2.62 3.1 4.6 5.73 5.73c.68.29 1.39.54 2.11.73c.22.06.38.26.38.49s-.16.43-.38.49a15 15 0 0 0-2.11.73c-2.63 1.13-4.6 3.11-5.73 5.73c-.29.68-.54 1.39-.73 2.11a.55.55 0 0 1-.49.38a.55.55 0 0 1-.49-.38a15 15 0 0 0-.73-2.11c-1.13-2.62-3.1-4.6-5.73-5.73a15 15 0 0 0-2.11-.73a.55.55 0 0 1-.38-.49c0-.23.16-.43.38-.49c.72-.19 1.43-.44 2.11-.73c2.63-1.13 4.6-3.11 5.73-5.73c.29-.68.54-1.39.73-2.11c.06-.22.26-.38.49-.38Z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <!-- 100% 复用现役 Obsidian Prism 原版全套样式体系 -->
  <link rel="stylesheet" href="/styles/v2-tokens.css" />
  <link rel="stylesheet" href="/styles/v2-components.css" />
  <link rel="stylesheet" href="/styles/workbench-shell.css" />
  <!-- 双极 Studio 终版动效、零 Emoji 单色侧栏与图四→图五增量样式 -->
  <link rel="stylesheet" href="/styles/studio-preview.css" />
</head>
<body>
  <div class="st-shell-root" id="st-shell-root">
    <!-- 顶部开发者调试条（1280px 单行零重叠，含 4 主题 / 5 语 / 动效档位 / 后台模拟 / 权限审计） -->
    <header class="st-devbar" data-testid="studio-devbar">
      <div class="st-dev-left">
        <a class="st-back-link" href="/" title="返回主光学工程台">← Workbench</a>
        <div class="st-dev-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 1.2c.25 0 .47.17.53.41c.21.79.48 1.56.8 2.31c1.23 2.86 3.39 5.02 6.25 6.25c.75.32 1.52.59 2.31.8c.24.06.41.28.41.53s-.17.47-.41.53a16 16 0 0 0-2.31.8c-2.86 1.23-5.02 3.39-6.25 6.25c-.32.75-.59 1.52-.8 2.31a.55.55 0 0 1-.53.41a.55.55 0 0 1-.53-.41a16 16 0 0 0-.8-2.31c-1.23-2.86-3.39-5.02-6.25-6.25a15 15 0 0 0-2.31-.8A.55.55 0 0 1 1.2 12c0-.25.17-.47.41-.53c.79-.21 1.56-.48 2.31-.8c2.86-1.23 5.02-3.39 6.25-6.25c.32-.75.59-1.52.8-2.31c.06-.24.28-.41.53-.41Z" fill="#669DF6"/>
          </svg>
          <span>Prism Studio</span>
        </div>
        <span class="st-sandbox-chip" id="st-sandbox-chip" data-testid="studio-sandbox-chip" title="隔离沙盒实例">SANDBOX</span>
      </div>

      <div class="st-dev-mid">
        <div class="st-pill-group" role="group" aria-label="四大旗舰主题快切">
          <button type="button" class="st-pill-btn" data-st-preset="obsidian-dark" data-active="1">Obsidian</button>
          <button type="button" class="st-pill-btn" data-st-preset="warm-dark">Warm</button>
          <button type="button" class="st-pill-btn" data-st-preset="daylight-crystal">冷晶</button>
          <button type="button" class="st-pill-btn" data-st-preset="warm-alabaster">暖白</button>
        </div>

        <select class="st-dev-select" id="sel-studio-locale" data-testid="studio-locale-select" aria-label="语言切换" title="9 语问候与界面切换">
          <option value="zh-CN" selected>简中</option>
          <option value="zh-TW">繁體</option>
          <option value="en">EN</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
          <option value="de">DE</option>
          <option value="tr">TR</option>
        </select>

        <button
          type="button"
          class="st-pill-btn"
          id="btn-toggle-username"
          data-testid="studio-username-toggle"
          title="切换示例用户名 (Alex) 与无名兜底问候"
        >Alex</button>

        <select class="st-dev-select" id="sel-studio-motion" data-testid="studio-motion-select" aria-label="动效档位" title="Motion Level 动效控制">
          <option value="ultra" selected>动效 Ultra</option>
          <option value="standard">Standard</option>
          <option value="subtle">Subtle</option>
          <option value="off">动效 Off</option>
        </select>

        <div class="st-pill-group" role="group" aria-label="模拟后台任务状态">
          <button type="button" class="st-pill-btn" id="btn-sim-running" data-testid="sim-bg-running">Run</button>
          <button type="button" class="st-pill-btn" id="btn-sim-blocked" data-testid="sim-bg-blocked">Block</button>
          <button type="button" class="st-pill-btn" id="btn-sim-idle" data-testid="sim-bg-idle">清</button>
        </div>
      </div>

      <div class="st-dev-right">
        <div
          class="st-audit-pill"
          id="st-global-audit-pill"
          data-testid="global-code-audit-pill"
          data-status="clean"
          title="项目级零干扰权限隔离审计"
        >
          <span class="st-audit-dot"></span>
          <span id="st-global-audit-text">Global Writes: 0</span>
        </div>
        <button type="button" class="st-pill-btn" id="btn-toggle-audit" data-testid="toggle-audit-drawer" data-active="1">审计</button>
        <button type="button" class="st-pill-btn st-btn-danger" id="btn-studio-reset" data-testid="studio-reset-btn">重置</button>
      </div>
    </header>

    <!-- 主工作区：左 1:1 现役 Obsidian Prism 双极舞台 + 右侧可收起权限审计抽屉 -->
    <div class="st-workspace-grid" id="st-workspace-grid" data-audit-open="1">
      <div
        class="ag-v2-stage st-prism-stage"
        id="studio-root"
        data-palette="obsidian"
        data-theme="dark"
        data-light-preset="crystal"
        data-serif="on"
        data-motion="ultra"
        data-active-mode="code"
        data-sidebar-collapsed="0"
      >
        <!-- 1:1 真实 Antigravity display: block 侧栏父壳（刻意非 flex，检验 height: 100% 防塌陷） -->
        <div class="st-host-sidebar-outer" data-testid="host-sidebar-block-shell">
          <div class="st-sidebar-height-guard" id="st-sidebar-mount"></div>
        </div>

        <!-- 现役 Obsidian Prism 原版主画布（Code 专属字符海 / Chat 专属增强版彩色环境氛围光） -->
        <div class="ag-v2-main st-prism-main" id="st-main-shell">
          <!-- Code 专属字符海波浪背景（Chat 模式隐藏） -->
          <div class="ag-v2-ripple-backdrop" id="st-ripple-backdrop" data-dormant="false">
            <canvas class="ag-cs-brand-glow ag-v2-brand-glow" data-testid="onboarding-brand-glow" aria-hidden="true"></canvas>
            <canvas class="ag-cs-ripple-canvas" aria-hidden="true"></canvas>
          </div>

          <!-- Chat 专属动态呼吸环境氛围光（Knowledge 蓝绿 Gemini 极光 / Spark Antigravity 失重棱镜光） -->
          <div
            class="st-chat-aura-layer"
            id="st-chat-aura"
            data-testid="chat-ambient-aura"
            data-phase="off"
            data-space-kind="knowledge"
            data-composer-focused="0"
            data-paused="0"
            aria-hidden="true"
          >
            <div class="st-chat-aura-orb st-aura-orb-a"></div>
            <div class="st-chat-aura-orb st-aura-orb-b"></div>
            <div class="st-chat-aura-orb st-aura-orb-c"></div>
            <div class="st-chat-aura-grain"></div>
          </div>

          <div class="ag-v2-titlebar st-prism-titlebar" id="st-main-topbar"></div>

          <div class="st-main-body" id="st-main-body">
            <div class="st-main-primary" id="st-main-primary"></div>
            <aside class="st-artifacts-pane" id="st-artifacts-pane" data-open="0" aria-hidden="true"></aside>
          </div>
        </div>

        <!-- 浮层挂载根（右键菜单 / [+] 菜单 / 权限围栏 / 后台角标预览 / WSL2 Modal / 拖拽标签 / Toast） -->
        <div id="st-overlay-root"></div>
      </div>

      <!-- 右侧开发者实时状态机与项目级权限隔离审计抽屉 -->
      <aside class="st-audit-drawer" id="st-audit-drawer" data-testid="studio-audit-drawer">
        <div class="st-audit-head">
          <span class="st-audit-title">状态机与权限隔离审计</span>
          <span class="st-audit-meta" id="st-rev-meta">rev=0 · nav=0</span>
        </div>
        <div class="st-audit-body" id="st-audit-body"></div>
      </aside>
    </div>
  </div>

  <!-- 原版 Obsidian Prism 共享视觉内核脚本 -->
  <script src="/shared/ripple-core.js"></script>
  <script src="/shared/motion-engine.js"></script>
  <script src="/shared/animated-icons.js"></script>
  <script src="/shared/dual-mascot-rig.js"></script>
  <script src="/shared/vial-core.js"></script>
  <script src="/shared/crystal-prism-core.js"></script>
  <script type="module" src="/studio.js"></script>
</body>
</html>
